name: Move assigned card
on:
  issues:
    types:
      - assigned
jobs:
  move-assigned-card:
    runs-on: ubuntu-latest
    steps:
      - uses: 
        with:
          project: @c4arl0s's backlog
          column: In Progress
          repo-token: ${{ secrets.Secret_of_UML }}
